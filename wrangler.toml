name = "imagefeed"
main = "src/index.js"
compatibility_date = "2025-10-01"
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# 한글 검색어를 영어로 번역해서 영어 소스(Pexels/Unsplash 등)에도 쓰는 기능.
# 필요 없으면 아래 두 줄을 지우세요. (Workers AI 무료 할당량 사용)
[ai]
binding = "AI"

[observability]
enabled = false
