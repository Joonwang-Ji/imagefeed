name = "imagefeed"
main = "src/index.js"
compatibility_date = "2025-10-01"
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Workers AI: 한글 검색어를 영어로 번역하고 고유명사인지 판별(영어 전용 소스용)하며, 이미지 설명(비슷한 이미지·사진으로 검색)에도 씁니다.
# 17차: 같은 AI 로 관심사 묶음용 텍스트 임베딩(/api/embed, bge-m3)도 만듭니다. 끄려면 변수 EMBED=off, 모델 변경은 EMBED_MODEL.
# 필요 없으면 아래 두 줄을 지우세요. (Workers AI 무료 할당량 사용)
[ai]
binding = "AI"

[observability]
enabled = false

# (선택) 트렌드 "최근 7일 누적"을 더 확실하게 하려면 아래 두 가지를 켜세요. 안 켜도 앱은 동작합니다(Cloudflare 캐시에 best-effort 로 쌓임).
#  1) KV: Cloudflare 대시보드 Storage & Databases → KV 에서 네임스페이스를 만들고, 이 워커의 Bindings 에 변수 이름 TREND_KV 로 연결하거나 아래처럼 id 를 적습니다.
#  2) 크론: 앱을 안 열어도 하루 한 번(매일 오전 6시 KST = 21:00 UTC) 인기 검색어를 쌓아 둡니다. (KV 가 있을 때 가장 확실)
# [[kv_namespaces]]
# binding = "TREND_KV"
# id = "여기에_네임스페이스_ID"
#
# [triggers]
# crons = ["0 21 * * *"]
# 19차: 카카오 블로그 검색 소스는 KAKAO_KEY 가 있으면 자동으로 켜집니다. 끄려면 변수 BLOG=off.
# 20차: Tumblr 는 비밀 변수 TUMBLR_KEY(OAuth Consumer Key) 가 있을 때 켜집니다. 블로그류(카카오 블로그) 전체를 끄려면 BLOG=off. (네이버 블로그·WordPress.com 소스는 제거됨)
# 22차: 새 소스 4개. Flickr 는 비밀 변수 FLICKR_KEY, Are.na 는 ARENA_TOKEN, Bluesky 는 BSKY_ID(예: 내아이디.bsky.social)와 BSKY_PASSWORD(앱 비밀번호) 둘 다 있을 때 켜집니다. Wallhaven 은 키 없이 항상 켜집니다.
