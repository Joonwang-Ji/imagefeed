name = "imagefeed"
main = "src/index.js"
compatibility_date = "2025-10-01"
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Workers AI: 한글 검색어를 영어로 번역(영어 전용 소스용)하고, 이미지 설명(비슷한 이미지·사진으로 검색)에도 씁니다.
# 필요 없으면 아래 두 줄을 지우세요. (Workers AI 무료 할당량 사용)
[ai]
binding = "AI"

[observability]
enabled = false
